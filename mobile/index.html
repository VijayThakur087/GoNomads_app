<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Go Nomads</title>
<style>
:root{--bg:#f1f5f9;--cd:#fff;--tx:#0f172a;--mu:#64748b;--ac:#0d9488;--bd:#e2e8f0;--rd:#e11d48;--gr:#059669;--am:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--cd:#162033;--tx:#e5e7eb;--mu:#94a3b8;--bd:#263248}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:fixed;top:0;left:0;right:0;z-index:5;background:#0f172a;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center}header b{font-size:17px}header small{opacity:.6;letter-spacing:.08em}
#v{padding:calc(62px + env(safe-area-inset-top,0px)) 14px calc(84px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0 8px;font:600 11px system-ui}nav button i{display:block;font-style:normal;font-size:20px}nav button.on{color:var(--ac)}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:28px;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 6px 18px #0004}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.k small{color:var(--mu);font-weight:600;text-transform:uppercase;font-size:10.5px}.k div{font-size:19px;font-weight:700;margin-top:2px}
.r{display:flex;justify-content:space-between;gap:10px;align-items:center}.m{color:var(--mu);font-size:12.5px}.row{padding:12px 0;border-top:1px solid var(--bd)}.row:first-child{border:0}
.b{border:0;border-radius:12px;padding:11px 16px;font:600 14px system-ui;background:var(--ac);color:#fff}.b.s{background:var(--bd);color:var(--tx)}.b.d{background:var(--rd)}.b.sm{padding:7px 12px;font-size:13px}.b[disabled]{opacity:.5}
.p{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700}.Paid{background:#d1fae5;color:#065f46}.Partial{background:#fef3c7;color:#92400e}.Unpaid,.Cancelled{background:#ffe4e6;color:#9f1239}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);font:16px system-ui;margin:3px 0 10px}label{font-size:12px;font-weight:700;color:var(--mu)}
#sh{position:fixed;inset:0;z-index:20;background:#0008;display:none;align-items:flex-end}#sh.on{display:flex}#sh>div{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto}
#t{position:fixed;left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:#0f172a;color:#fff;padding:12px 14px;border-radius:12px;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none;font-size:14px}#t.on{opacity:1;transform:none}
.seg{display:flex;background:var(--bd);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font:600 14px system-ui;color:var(--mu)}.seg button.on{background:var(--cd);color:var(--tx)}
.ban{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:14px;padding:12px;margin-bottom:12px;font-size:13px}#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important;color:#000;background:#fff;padding:14mm;font-size:12px}#pr table{width:100%;border-collapse:collapse}#pr td,#pr th{padding:5px;border-bottom:1px solid #ccc;text-align:left}#pr .n{text-align:right}}
header{background:linear-gradient(135deg,#0f172a,#134e4a)}.hd{display:flex;align-items:center}header img{height:30px;background:#fff;border-radius:8px;padding:2px 6px;margin-right:10px}
.hero{background:linear-gradient(135deg,#0f766e,#0f172a);color:#fff;border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 8px 24px #0f766e44}.hero small{opacity:.75;font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.06em}.hero div{font-size:30px;font-weight:800;margin:4px 0}.hero span{font-size:12.5px;opacity:.85}
.c{box-shadow:0 1px 3px #0f172a12}nav svg{width:22px;height:22px;display:block;margin:0 auto 2px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.b:active{transform:scale(.97)}
#lk{position:fixed;inset:0;z-index:50;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}#lk input{width:200px;text-align:center;font-size:22px;letter-spacing:8px}
</style></head><body>

/* ---- v3.2: advance receipt vouchers + reset ---- */
const AD=()=>S.advances||(S.advances=[]);
const advTax=(amt,rate,intra)=>{let tx=r2(amt*100/(100+rate)),tax=r2(amt-tx);if(intra&&Math.round(tax*100)%2){tax=r2(tax-.01);tx=r2(amt-tax)}const c=intra?r2(tax/2):0;return{taxable:tx,tax,cgst:c,sgst:intra?r2(tax-c):0,igst:intra?0:tax}};
const advOf=i=>(i&&!i.cancelled&&i.advAdj)||[],advUsed=a=>{let u=0;S.invoices.forEach(i=>advOf(i).forEach(x=>{if(x.advId==a.id)u+=x.amount}));return r2(u)},advBal=a=>Math.max(0,r2(a.amount-advUsed(a))),advSt=a=>advBal(a)<=.004?'Adjusted':advUsed(a)>.004?'Part-adjusted':'Unadjusted',ipos=i=>i.pos||(i.clientGstin||'').slice(0,2)||own();
const sname=c=>(ST.find(x=>x[0]==c)||[c,c])[1];
function advShare(a,amt){const last=r2(advUsed(a)+amt)>=a.amount-.004,o={};TK.forEach(k=>{let d=0;S.invoices.forEach(i=>advOf(i).forEach(x=>{if(x.advId==a.id)d+=x[k]}));o[k]=last?r2(a[k]-d):r2(a[k]*amt/a.amount)});return o}
function advCheck(i,a,amt){if(!i||!a)return'Record not found.';if(i.cancelled||i.isCN)return'Invoice is cancelled or a credit note.';if(a.pos!=ipos(i))return'Place of supply differs (advance: '+sname(a.pos)+', invoice: '+sname(ipos(i))+'). GST paid on the advance cannot be set off here.';if(!(amt>0))return'Enter an amount above zero.';if(amt>advBal(a)+.004)return'More than the unadjusted advance ('+inr(advBal(a))+').';if(amt>due(i)+.004)return'More than the invoice balance ('+inr(due(i))+').';return''}
function advApply(i,a,amt){amt=r2(amt);const sh=advShare(a,amt);(i.advAdj=i.advAdj||[]).push(Object.assign({advId:a.id,number:a.number,rdate:a.date,amount:amt},sh));(i.receipts=i.receipts||[]).push({date:a.date,amount:amt,mode:'Advance adjusted',ref:a.number,advId:a.id})}
const segH=()=>`<div class="seg">${[['ar','Receivable'],['ap','Payable'],['adv','Advances']].map(([k,l])=>`<button class="${mt==k?'on':''}" data-a="mt" data-i="${k}">${l}</button>`).join('')}</div>`;
const _mon=V.money;
V.money=()=>{if(mt!='adv'){_mon();const sg=$('#v .seg');if(sg)sg.outerHTML=segH();return}
 $('#v').innerHTML=segH()+`<button class="b" style="width:100%;margin-bottom:12px" data-a="advnew">+ New advance receipt voucher</button><div class="c k"><small>Unadjusted advances</small><div>${inr(sum(AD(),advBal))}</div></div><div class="c">${AD().slice(0,100).map(a=>`<div class="row r" data-a="advview" data-i="${esc(a.id)}"><div><b>${esc(a.client)}</b><div class="m">${esc(a.number)} · ${esc(a.date)}</div></div><div style="text-align:right"><b>${inr(a.amount)}</b><br><span class="p ${advSt(a)=='Adjusted'?'Paid':'Partial'}">${advSt(a)}</span></div></div>`).join('')||'<p class="m">No advance receipts yet.</p>'}</div>`};
A.advnew=()=>{sheet(`<h3 style="margin:0 0 8px">Advance receipt voucher</h3><label>Customer</label><input id="a-c" list="dlc2" autocomplete="off"><datalist id="dlc2">${S.customers.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><label>Phone</label><input id="a-p" inputmode="tel"><label>Address</label><textarea id="a-ad" rows="2"></textarea><label>Customer GSTIN (if registered)</label><input id="a-g" maxlength="15" autocapitalize="characters"><label>Place of supply</label><select id="a-s">${ST.map(([c,n])=>`<option value="${c}" ${c==own()?'selected':''}>${c} – ${n}</option>`).join('')}</select><div class="g"><div><label>Amount received ₹</label><input id="a-a" type="number" inputmode="decimal"></div><div><label>GST rate %</label><select id="a-r">${[0,3,5,12,18,28].map(r=>`<option ${r==5?'selected':''}>${r}</option>`).join('')}</select></div><div><label>Date</label><input id="a-d" type="date" value="${today()}"></div><div><label>Mode / ref</label><input id="a-m" placeholder="UPI / NEFT"></div></div><label>Towards (tour / booking)</label><input id="a-t"><div class="c m" id="a-calc"></div><div class="r"><button class="b s" data-a="close">Cancel</button><button class="b" data-a="advsave">Save & create voucher</button></div>`);
 const calc=()=>{const amt=parseFloat($('#a-a').value)||0,t=advTax(amt,+$('#a-r').value,$('#a-s').value==own());$('#a-calc').innerHTML=`Taxable ${inr(t.taxable)} + GST ${inr(t.tax)} (${$('#a-s').value==own()?'CGST '+inr(t.cgst)+' + SGST '+inr(t.sgst):'IGST '+inr(t.igst)}). GST is payable on advances when received.`};
 $('#shb').oninput=e=>{if(e.target.id=='a-g'&&e.target.value.length>=2)$('#a-s').value=e.target.value.slice(0,2);const m=S.customers.find(c=>c.name==$('#a-c').value);if(e.target.id=='a-c'&&m){$('#a-p').value=m.contact||'';if(m.gstin){$('#a-g').value=m.gstin;$('#a-s').value=m.gstin.slice(0,2)}}calc()};$('#shb').onchange=calc;calc()};
A.advsave=async()=>{const g=$('#a-g').value.trim().toUpperCase(),amt=parseFloat($('#a-a').value)||0,rate=+$('#a-r').value,date=$('#a-d').value,pos=$('#a-s').value,cl=$('#a-c').value.trim();
 if(!cl||amt<=0||!date)return toast('Enter customer, amount and date.');if(g&&!gOK(g)&&!confirm('GSTIN looks invalid. Save anyway?'))return;
 const a=Object.assign({id:uid('adv'),number:nextNo('RV',date,AD()),date,client:cl,contact:$('#a-p').value.trim(),addr:$('#a-ad').value.trim(),gstin:g,pos,amount:amt,rate,mode:$('#a-m').value.trim(),tour:$('#a-t').value.trim()},advTax(amt,rate,pos==own()));
 AD().unshift(a);if(!S.customers.find(c=>c.name==cl))S.customers.unshift({id:Date.now(),name:cl,contact:a.contact,gstin:g,addr:a.addr});if(await save()){toast('Voucher '+a.number+' created');A.advview(a.id)}else AD().shift()};
A.advview=id=>{const a=AD().find(x=>x.id==id);if(!a)return;const rows=[];S.invoices.forEach(i=>advOf(i).forEach(x=>{if(x.advId==id)rows.push(`<div class="r row m"><span>${esc(i.number)} · ${inr(x.amount)} (GST ${inr(x.tax)})</span><button class="b s sm" data-a="advrel" data-i="${esc(i.id)}:${esc(id)}">Release</button></div>`)}));
 sheet(`<div class="r"><h3 style="margin:0">${esc(a.number)}</h3><span class="p ${advSt(a)=='Adjusted'?'Paid':'Partial'}">${advSt(a)}</span></div><p class="m">${esc(a.date)} · ${esc(a.client)} ${a.gstin?'· '+esc(a.gstin):''}<br>Place of supply: ${esc(sname(a.pos))}<br>${esc(a.tour)}</p><div class="c"><div class="r m"><span>Received (incl. GST)</span><b>${inr(a.amount)}</b></div><div class="r m"><span>Taxable value</span><span>${inr(a.taxable)}</span></div>${a.pos==own()?`<div class="r m"><span>CGST @ ${a.rate/2}%</span><span>${inr(a.cgst)}</span></div><div class="r m"><span>SGST @ ${a.rate/2}%</span><span>${inr(a.sgst)}</span></div>`:`<div class="r m"><span>IGST @ ${a.rate}%</span><span>${inr(a.igst)}</span></div>`}<div class="r"><b>Unadjusted</b><b>${inr(advBal(a))}</b></div></div><b>Adjusted against invoices</b>${rows.join('')||'<p class="m">Not adjusted yet.</p>'}<div class="g" style="margin-top:12px"><button class="b s" data-a="advprint" data-i="${esc(id)}">Print / PDF</button>${advBal(a)>.004?`<button class="b" data-a="advadj" data-i="${esc(id)}">Adjust to invoice</button>`:''}${advUsed(a)<.004?`<button class="b d" data-a="advdel" data-i="${esc(id)}">Delete</button>`:''}</div>`)};
A.advprint=id=>{const a=AD().find(x=>x.id==id),c=co(),intra=a.pos==own();$('#pr').innerHTML=`<img src="${LOGO}" style="height:64px"><h2 style="margin:0">${esc(c.name||'Go Nomads')}</h2><div>${esc(c.addr)}<br>GSTIN: ${esc(c.gstin)}</div><h3 style="text-align:right">RECEIPT VOUCHER ${esc(a.number)}<br><small>${esc(a.date)}</small></h3><p><b>Received from:</b> ${esc(a.client)} ${a.gstin?'(GSTIN '+esc(a.gstin)+')':''}<br>${esc(a.addr)} ${esc(a.contact)}<br><b>Place of supply:</b> ${esc(sname(a.pos))}<br><b>Towards:</b> ${esc(a.tour||'Tour services')} (SAC 998551) ${a.mode?'· '+esc(a.mode):''}</p><table><tr><td>Advance received (tax-inclusive)</td><td class="n">${inr(a.amount)}</td></tr><tr><td>Taxable value</td><td class="n">${inr(a.taxable)}</td></tr>${intra?`<tr><td>CGST @ ${a.rate/2}%</td><td class="n">${inr(a.cgst)}</td></tr><tr><td>SGST @ ${a.rate/2}%</td><td class="n">${inr(a.sgst)}</td></tr>`:`<tr><td>IGST @ ${a.rate}%</td><td class="n">${inr(a.igst)}</td></tr>`}</table><p>Amount in words: ${inr(a.amount)}</p><p style="font-size:11px">This is a receipt voucher for an advance. A tax invoice will be issued on supply and this advance will be adjusted against it.</p><p style="margin-top:40px;text-align:right">For ${esc(c.name||'Go Nomads')}<br><br>Authorised Signatory</p>`;setTimeout(()=>print(),150)};
A.advadj=id=>{const a=AD().find(x=>x.id==id),o=S.invoices.filter(i=>!i.cancelled&&!i.isCN&&i.clientName.toLowerCase()==a.client.toLowerCase()&&ipos(i)==a.pos&&due(i)>.004);if(!o.length)return toast('Needs an open invoice for the same customer and place of supply.');
 sheet(`<h3 style="margin:0 0 8px">Adjust ${esc(a.number)}</h3><p class="m">Unadjusted ${inr(advBal(a))}</p><label>Invoice</label><select id="j-i">${o.map(i=>`<option value="${esc(i.id)}">${esc(i.number)} – due ${inr(due(i))}</option>`).join('')}</select><label>Amount ₹</label><input id="j-a" type="number" inputmode="decimal"><div class="r"><button class="b s" data-a="close">Cancel</button><button class="b" id="j-go">Adjust</button></div>`);
 const fill=()=>{const i=S.invoices.find(x=>x.id==$('#j-i').value);$('#j-a').value=Math.min(advBal(a),due(i))};fill();$('#j-i').onchange=fill;
 $('#j-go').onclick=async()=>{const i=S.invoices.find(x=>x.id==$('#j-i').value),amt=r2(parseFloat($('#j-a').value)||0),er=advCheck(i,a,amt);if(er)return toast(er);advApply(i,a,amt);if(await save()){toast(inr(amt)+' set against '+i.number);A.advview(id)}else{i.advAdj.pop();i.receipts.pop()}}};
A.advrel=async v=>{const[iid,aid]=v.split(':'),i=S.invoices.find(x=>x.id==iid),k=i?(i.advAdj||[]).findIndex(x=>x.advId==aid):-1;if(k<0||!confirm('Release this advance from '+i.number+'? Invoice balance goes up and the GST adjustment is reversed.'))return;const x=i.advAdj.splice(k,1)[0],j=(i.receipts||[]).findIndex(r=>r.advId==aid&&Math.abs(r.amount-x.amount)<.005),rc=j>=0?i.receipts.splice(j,1)[0]:null;if(await save()){toast('Released');A.advview(aid)}else{i.advAdj.splice(k,0,x);if(rc)i.receipts.splice(j,0,rc)}};
A.advdel=async id=>{const a=AD().find(x=>x.id==id);if(!a||advUsed(a)>.004||!confirm('Delete voucher '+a.number+'? Only do this if entered by mistake.'))return;const old=S.advances;S.advances=old.filter(x=>x.id!=id);if(await save()){closeSh();go('money')}else S.advances=old};
A.reset=()=>{sheet(`<h3 style="margin:0 0 8px;color:var(--rd)">Reset all data</h3><div class="c"><p class="m">Stored now: ${S.invoices.length} invoices, ${AD().length} advance receipts, ${S.payables.length} vendor bills, ${S.costings.length} cost sheets, ${S.ledger.length} entries, ${S.customers.length} clients, ${S.vendors.length} vendors. All will be deleted from this phone.</p><b>Step 1 – Download a backup</b><br><br><button class="b s sm" data-a="backup">Export backup</button></div><label style="display:flex;gap:8px;align-items:center"><input id="r-a" type="checkbox" style="width:auto;margin:0"> Step 2 – I understand this deletes all my data.</label><br><label style="display:flex;gap:8px;align-items:center"><input id="r-k" type="checkbox" checked style="width:auto;margin:0"> Keep company details and PIN</label><br><label>Step 3 – type RESET</label><input id="r-t" autocomplete="off" autocapitalize="characters"><div class="r"><button class="b s" data-a="close">Cancel</button><button class="b d" id="r-go" disabled>Erase all data</button></div>`);
 const chk=()=>$('#r-go').disabled=!($('#r-a').checked&&$('#r-t').value.trim()=='RESET');$('#r-a').onchange=chk;$('#r-t').oninput=chk;
 $('#r-go').onclick=async()=>{await snapAdd('Before reset');const prev=S,old=S.settings,keep=$('#r-k').checked;S=norm({});if(keep){S.settings.company=old.company||{};if(old.pin)S.settings.pin=old.pin}if(await save()){closeSh();toast('All data erased. A restore point was kept in More.');go('home')}else S=prev}};
/* ---- boot ---- */
(async()=>{await open();const g=await kv('get',KEY);if(g.e){RO=true;S=norm({});setTimeout(()=>alert('Storage is unavailable or unreadable. The app is READ-ONLY so nothing is overwritten. Restore a backup from More.'),400)}else{try{S=norm(g.v?JSON.parse(g.v):{})}catch(e){RO=true;S=norm({});setTimeout(()=>alert('Saved data is unreadable. Saving is disabled; restore a backup from More.'),400)}}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 if(!RO&&(S.invoices.length||S.payables.length)){const a=await snapList();if(!a.length||Date.now()-new Date(a[0].at)>864e5)snapAdd('Automatic daily')}
 $('#lg').src=LOGO;if(S.settings.pin)lock();go('home');if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
